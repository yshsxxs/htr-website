<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小姚聊天 ChatBox</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif; background:#EDEDED; height:100vh; display:flex; flex-direction:column; }
/* 登录页 */
#login { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
#login h1 { font-size:30px; color:#07C160; margin-bottom:8px; }
#login p.sub { color:#999; font-size:13px; margin-bottom:36px; }
#login input { width:100%; max-width:320px; padding:13px 15px; margin:7px 0; border:1px solid #ddd; border-radius:8px; font-size:16px; background:#fff; }
#login button { width:100%; max-width:320px; padding:14px; margin-top:20px; background:#07C160; color:#fff; border:0; border-radius:8px; font-size:17px; font-weight:600; }
#login .tip { margin-top:22px; color:#aaa; font-size:12px; text-align:center; line-height:1.7; }
/* 聊天页 */
#chat { display:none; flex:1; flex-direction:column; height:100vh; }
#top { background:#4C4C4C; color:#fff; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
#top .room { font-size:16px; font-weight:600; }
#top .st { font-size:12px; color:#FFD54F; }
#msgs { flex:1; overflow-y:auto; padding:12px 10px; -webkit-overflow-scrolling:touch; }
.row { margin-bottom:13px; display:flex; flex-direction:column; }
.row.me { align-items:flex-end; }
.row.other { align-items:flex-start; }
.meta { font-size:11px; color:#999; margin-bottom:3px; padding:0 4px; }
.bubble { max-width:76%; padding:9px 13px; border-radius:8px; font-size:15px; line-height:1.45; word-wrap:break-word; background:#fff; color:#111; }
.row.me .bubble { background:#95EC69; }
.bubble.sys { background:#E0E0E0; color:#666; font-size:13px; }
#bottom { flex-shrink:0; background:#F7F7F7; padding:9px 10px; display:flex; gap:9px; align-items:center; }
#bottom input { flex:1; padding:11px 13px; border:1px solid #ddd; border-radius:20px; font-size:15px; background:#fff; }
#bottom button { background:#07C160; color:#fff; border:0; border-radius:20px; padding:11px 20px; font-size:15px; font-weight:600; }
</style>
</head>
<body>

<div id="login">
  <h1>小姚聊天</h1>
  <p class="sub">ChatBox · 像微信一样聊天</p>
  <input id="nick" placeholder="你的昵称" value="">
  <input id="room" placeholder="房间名（大家输一样的）" value="yao-class-chat">
  <button onclick="enter()">进入聊天</button>
  <div class="tip">同一个房间名就能互相聊天<br>跨网络 · 免费 · 不用 WiFi 密码</div>
</div>

<div id="chat">
  <div id="top"><span class="room" id="roomName">-</span><span class="st" id="status">连接中…</span></div>
  <div id="msgs"></div>
  <div id="bottom">
    <input id="msg" placeholder="说点什么…" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
</div>

<script src="mqtt.min.js"></script>
<script>
var client=null, nick="", room="", connected=false;
var BROKER="wss://broker.emqx.io:8084/mqtt";

function enter(){
  nick=(document.getElementById("nick").value||"").trim()||"同学";
  room=(document.getElementById("room").value||"").trim()||"yao-class-chat";
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="flex";
  document.getElementById("roomName").textContent=room;
  addMsg("系统","已进入房间「"+room+"」",false,true);
  connect();
}

function connect(){
  var st=document.getElementById("status");
  try{
    client=mqtt.connect(BROKER,{clientId:"yao_"+nick+"_"+Math.floor(Math.random()*99999),keepalive:30,reconnectPeriod:3000,connectTimeout:15000});
    client.on("connect",function(){
      connected=true; st.textContent="已连接"; st.style.color="#8BC34A";
      client.subscribe("yaochat/"+room,{qos:1});
    });
    client.on("message",function(topic,payload){
      try{
        var d=JSON.parse(payload.toString());
        if(d.nick===nick) return;
        addMsg(d.nick,d.text,false,false);
      }catch(e){}
    });
    client.on("error",function(e){ st.textContent="连接错误"; st.style.color="#FF5252"; });
    client.on("offline",function(){ st.textContent="离线重连中…"; st.style.color="#FFD54F"; });
    client.on("close",function(){ if(connected){st.textContent="重连中…";st.style.color="#FFD54F";} });
  }catch(e){ st.textContent="失败:"+e.message; st.style.color="#FF5252"; }
}

function send(){
  var el=document.getElementById("msg");
  var text=(el.value||"").trim();
  if(!text) return;
  el.value="";
  addMsg(nick,text,true,false);
  if(client&&connected){
    client.publish("yaochat/"+room,JSON.stringify({nick:nick,text:text}),{qos:1});
  }else{
    addMsg("系统","未连接服务器，消息未发送",false,true);
  }
}

function addMsg(who,text,mine,sys){
  var msgs=document.getElementById("msgs");
  var d=new Date();
  var t=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
  var row=document.createElement("div");
  row.className="row "+(mine?"me":"other");
  var meta=document.createElement("div");
  meta.className="meta"; meta.textContent=who+"  "+t;
  var b=document.createElement("div");
  b.className="bubble"+(sys?" sys":""); b.textContent=text;
  row.appendChild(meta); row.appendChild(b);
  msgs.appendChild(row);
  msgs.scrollTop=msgs.scrollHeight;
}
</script>
</body>
</html>
